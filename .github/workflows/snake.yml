name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # setiap hari jam 00:00 UTC
  workflow_dispatch: {}    # bisa dijalankan manual dari tab Actions
  push:
    branches:
      - main               # sesuaikan kalau branch utama kamu bukan "main"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: toikkkk
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#f0883e&color_dots=#161b22,#0d419d,#1158c7,#316dca,#58a6ff&color_outline=#30363d
            dist/github-contribution-grid-snake-dark.svg?color_snake=#f0883e&color_dots=#161b22,#0d419d,#1158c7,#316dca,#58a6ff&color_outline=#30363d

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
